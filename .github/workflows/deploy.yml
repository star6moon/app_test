# 서버 배포 + 폰으로 앱 보내기 + 서버 로그 보기 (README "자동 배포" 참고)
#
# 필요한 GitHub 비밀(Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  서비스 계정 키(JSON 전체)        → 서버 배포, 앱 보내기, 로그
#   GOOGLE_SERVICES_JSON      app/google-services.json 내용    → 앱 보내기
#   MAPS_API_KEY              지도 키                           → 앱 보내기 (없으면 지도만 안 보임)
# 변수(Variables 탭):
#   TESTER_EMAILS             앱을 받을 사람 이메일 (쉼표로 구분)
#   APP_CHECK_REQUIRED, IDENTIFY_DAILY_LIMIT  (선택, 기본 false / 50)
# 비밀이 없으면 해당 작업은 건너뛰고 실패로 표시하지 않습니다.
name: Deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "무엇을 할까요 (all: 서버+앱, server, app, logs: 서버 로그 보기, identify-test: 식물 식별 시험, names: 식물 이름 목록 만들기)"
        type: choice
        options: [all, server, app, logs, identify-test, names]
        default: all
      log_filter:
        description: "logs 일 때 추가 조건 (예: resource.labels.service_name=\"identifyplant\")"
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.target || 'push' }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: plantdex-test

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.decide.outputs.server }}
      app: ${{ steps.decide.outputs.app }}
      logs: ${{ steps.decide.outputs.logs }}
      test: ${{ steps.decide.outputs.test }}
      names: ${{ steps.decide.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            server:
              - 'functions/**'
              - 'firebase/**'
              - 'firebase.json'
              - 'app/src/main/assets/catalogs.json'
            app:
              - 'app/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
      - id: decide
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_APP: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          SERVER_CHANGED: ${{ steps.changes.outputs.server }}
          APP_CHANGED: ${{ steps.changes.outputs.app }}
        run: |
          server=false; app=false; logs=false; test=false; names=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$TARGET" in
              all) server=true; app=true ;;
              server) server=true ;;
              app) app=true ;;
              logs) logs=true ;;
              identify-test) test=true ;;
              names) names=true ;;
            esac
          else
            server=$SERVER_CHANGED; app=$APP_CHANGED
          fi
          if [ "$HAS_SA" != "true" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT 비밀이 없어 자동 배포를 건너뜁니다 (README '자동 배포' 참고)"
            server=false; app=false; logs=false; test=false; names=false
          fi
          if [ "$app" = "true" ] && [ "$HAS_APP" != "true" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON 비밀이 없어 앱 보내기를 건너뜁니다"
            app=false
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "logs=$logs" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "서버 배포: $server / 앱 보내기: $app / 로그: $logs / 식별 시험: $test"

  server:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Function settings
        run: |
          cat > "functions/.env.${FIREBASE_PROJECT}" <<EOF
          APP_CHECK_REQUIRED=${{ vars.APP_CHECK_REQUIRED || 'false' }}
          IDENTIFY_DAILY_LIMIT=${{ vars.IDENTIFY_DAILY_LIMIT || '50' }}
          EOF
      - name: Deploy rules, indexes and functions
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore,storage,functions \
            --project "$FIREBASE_PROJECT" --non-interactive --force

  app:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 버전 번호(커밋 수)를 세려면 전체 기록이 필요합니다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Real Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      # 디버그 빌드는 저장소의 개발용 키(app/keystore/plantdex-dev.jks)로 서명합니다.
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Check the APK is signed with the registered key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk_sha1=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | awk -F': ' '/certificate SHA-1 digest/ {print $NF; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK 서명 SHA-1: $apk_sha1"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          echo "APK 안의 웹 클라이언트 ID:"
          "$aapt2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -A1 'string/default_web_client_id' | tail -1
          echo "google-services.json 의 프로젝트 번호: $(jq -r .project_info.project_number app/google-services.json)"
          echo "등록된 OAuth 클라이언트: $(jq -c '[.client[].oauth_client[] | {client_type, client_id: (.client_id[0:20])}]' app/google-services.json)"
          if jq -e --arg h "$apk_sha1" '[.. | .certificate_hash? // empty] | index($h)' app/google-services.json > /dev/null; then
            echo "Firebase 에 등록된 지문과 같습니다."
          else
            echo "::warning::APK 서명($apk_sha1)이 GOOGLE_SERVICES_JSON 에 없습니다. Firebase 에 이 지문을 추가하고 google-services.json 을 다시 받아 비밀값을 바꾸세요 (README '서명 키')."
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send to phones (Firebase App Distribution)
        env:
          TESTERS: ${{ vars.TESTER_EMAILS }}
          NOTES: ${{ github.event.head_commit.message || format('수동 실행 ({0})', github.sha) }}
        run: |
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name=="com.plantdex.app") | .client_info.mobilesdk_app_id' app/google-services.json)
          printf '%s\n' "$NOTES" | head -c 15000 > release-notes.txt
          args=(app/build/outputs/apk/debug/app-debug.apk --app "$APP_ID" --project "$FIREBASE_PROJECT" --release-notes-file release-notes.txt)
          if [ -n "$TESTERS" ]; then args+=(--testers "$TESTERS"); fi
          npx --yes firebase-tools@latest appdistribution:distribute "${args[@]}"

  logs:
    needs: plan
    if: needs.plan.outputs.logs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Server logs (last 24h)
        env:
          EXTRA: ${{ inputs.log_filter }}
        run: |
          filter='resource.type="cloud_run_revision"'
          if [ -n "$EXTRA" ]; then filter="$filter AND ($EXTRA)"; fi
          gcloud logging read "$filter" --project "$FIREBASE_PROJECT" --freshness=1d --limit=150 --format=json \
            | jq -r 'reverse | .[] | [.timestamp, .resource.labels.service_name, .severity,
                ((.jsonPayload // .textPayload // .httpRequest // {}) | tostring | .[0:600])] | @tsv'

  # 위키백과의 실제 식물 사진으로 (1) Pl@ntNet 을 직접, (2) 앱과 같은 경로(서버 함수)로 식별해 봅니다.
  identify-test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Test photos (Wikipedia)
        run: |
          mkdir -p test-photos
          for page in Helianthus_annuus Taraxacum_officinale Bellis_perennis; do
            thumb=$(curl -sS -A "PlantDex-identify-test" "https://en.wikipedia.org/api/rest_v1/page/summary/$page" | jq -r '.thumbnail.source // empty')
            [ -z "$thumb" ] && { echo "$page: 사진 주소 없음"; continue; }
            big=$(printf '%s' "$thumb" | sed -E 's#/[0-9]+px-#/1024px-#')
            curl -sSfL -A "PlantDex-identify-test" -o "test-photos/$page.jpg" "$big" \
              || curl -sSfL -A "PlantDex-identify-test" -o "test-photos/$page.jpg" "$thumb" \
              || { echo "$page: 내려받기 실패"; rm -f "test-photos/$page.jpg"; continue; }
            echo "$page: $(file -b "test-photos/$page.jpg" | cut -c1-60)"
          done
          ls test-photos/*.jpg > /dev/null
      - name: Pl@ntNet directly
        continue-on-error: true
        run: |
          key=$(gcloud secrets versions access latest --secret=PLANTNET_API_KEY --project "$FIREBASE_PROJECT")
          echo "::add-mask::$key"
          base="https://my-api.plantnet.org/v2/identify/all?api-key=$key&nb-results=3&include-related-images=false"
          for photo in test-photos/*.jpg; do
            echo "== $(basename "$photo")"
            # 이름 | 추가 주소 옵션 | organs 값 (빈 값이면 보내지 않음)
            while IFS='|' read -r name query organ; do
              args=(-F "images=@$photo;type=image/jpeg")
              [ -n "$organ" ] && args+=(-F "organs=$organ")
              out=$(curl -sS -m 60 -o body.json -w '%{http_code}' -X POST "$base$query" "${args[@]}") || out="연결 실패"
              summary=$(jq -r 'if .results then ([.results[:3][] | "\(.species.scientificNameWithoutAuthor) \((.score*1000|round)/10)%"] | join(", ")) else (.message // tostring) end' body.json 2>/dev/null || head -c 300 body.json)
              echo "  [$name] HTTP $out: $summary"
            done <<'EOF'
          앱과 같은 요청|&lang=ko&no-reject=true|auto
          영어|&lang=en|auto
          영어, organs=flower|&lang=en|flower
          영어, organs 없음|&lang=en|
          EOF
          done
      - name: Through the app's server (identifyPlant)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::notice::GOOGLE_SERVICES_JSON 비밀이 없어 건너뜁니다"; exit 0; fi
          WEB_API_KEY=$(printf '%s' "$GOOGLE_SERVICES_JSON" | jq -r '.client[0].api_key[0].current_key')
          echo "::add-mask::$WEB_API_KEY"
          export WEB_API_KEY ANDROID_PACKAGE=com.plantdex.app
          # 개발용 서명 키(app/keystore/plantdex-dev.jks)의 SHA-1
          export ANDROID_CERT_SHA1=378E5F6E7240164D602440A1A03AE84E917EE0E7
          node functions/scripts/identify-test.mjs test-photos/*.jpg

  # 식물 이름 목록(한국어·영어)을 새로 만들어 같은 브랜치에 커밋합니다 (tools/plant_names/build.py).
  # Pl@ntNet 이 아는 모든 종의 학명·영어 이름 + Wikidata 의 한국어 이름 → app/src/main/assets/plant_names.json
  names:
    needs: plan
    if: needs.plan.outputs.names == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the name list
        run: |
          key=$(gcloud secrets versions access latest --secret=PLANTNET_API_KEY --project "$FIREBASE_PROJECT")
          echo "::add-mask::$key"
          PLANTNET_API_KEY="$key" python3 tools/plant_names/build.py app/src/main/assets/plant_names.json
          ls -la app/src/main/assets/plant_names.json
      - name: Commit
        run: |
          rm -f gha-creds-*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/plant_names.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "Update the plant name list (Korean and English)"
          git push
