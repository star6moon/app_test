# 서버 배포 + 폰으로 앱 보내기 + 서버 로그 보기 (README "자동 배포" 참고)
#
# 필요한 GitHub 비밀(Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  서비스 계정 키(JSON 전체)        → 서버 배포, 앱 보내기, 로그
#   GOOGLE_SERVICES_JSON      app/google-services.json 내용    → 앱 보내기
#   DEBUG_KEYSTORE_BASE64     ~/.android/debug.keystore (base64) → 앱 보내기 (내 PC 와 같은 서명)
#   MAPS_API_KEY              지도 키                           → 앱 보내기 (없으면 지도만 안 보임)
# 변수(Variables 탭):
#   TESTER_EMAILS             앱을 받을 사람 이메일 (쉼표로 구분)
#   APP_CHECK_REQUIRED, IDENTIFY_DAILY_LIMIT  (선택, 기본 false / 50)
# 비밀이 없으면 해당 작업은 건너뛰고 실패로 표시하지 않습니다.
name: Deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "무엇을 할까요 (all: 서버+앱, server, app, logs: 서버 로그 보기)"
        type: choice
        options: [all, server, app, logs]
        default: all
      log_filter:
        description: "logs 일 때 추가 조건 (예: resource.labels.service_name=\"identifyplant\")"
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.target || 'push' }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: plantdex-test

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.decide.outputs.server }}
      app: ${{ steps.decide.outputs.app }}
      logs: ${{ steps.decide.outputs.logs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'push'
        with:
          filters: |
            server:
              - 'functions/**'
              - 'firebase/**'
              - 'firebase.json'
              - 'app/src/main/assets/catalogs.json'
            app:
              - 'app/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
      - id: decide
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_APP: ${{ secrets.GOOGLE_SERVICES_JSON != '' && secrets.DEBUG_KEYSTORE_BASE64 != '' }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          SERVER_CHANGED: ${{ steps.changes.outputs.server }}
          APP_CHANGED: ${{ steps.changes.outputs.app }}
        run: |
          server=false; app=false; logs=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$TARGET" in
              all) server=true; app=true ;;
              server) server=true ;;
              app) app=true ;;
              logs) logs=true ;;
            esac
          else
            server=$SERVER_CHANGED; app=$APP_CHANGED
          fi
          if [ "$HAS_SA" != "true" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT 비밀이 없어 자동 배포를 건너뜁니다 (README '자동 배포' 참고)"
            server=false; app=false; logs=false
          fi
          if [ "$app" = "true" ] && [ "$HAS_APP" != "true" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON / DEBUG_KEYSTORE_BASE64 비밀이 없어 앱 보내기를 건너뜁니다"
            app=false
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "logs=$logs" >> "$GITHUB_OUTPUT"
          echo "서버 배포: $server / 앱 보내기: $app / 로그: $logs"

  server:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Function settings
        run: |
          cat > "functions/.env.${FIREBASE_PROJECT}" <<EOF
          APP_CHECK_REQUIRED=${{ vars.APP_CHECK_REQUIRED || 'false' }}
          IDENTIFY_DAILY_LIMIT=${{ vars.IDENTIFY_DAILY_LIMIT || '50' }}
          EOF
      - name: Deploy rules, indexes and functions
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore,storage,functions \
            --project "$FIREBASE_PROJECT" --non-interactive --force

  app:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Real Firebase config and my debug signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          # 서명 지문 확인: Firebase 에 등록된 지문(google-services.json)과 같아야 Google 로그인이 됩니다.
          sha1=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | awk '/SHA1:/ {print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "디버그 서명 SHA-1: $sha1"
          if jq -e --arg h "$sha1" '[.. | .certificate_hash? // empty] | index($h)' app/google-services.json > /dev/null; then
            echo "Firebase 에 등록된 지문과 같습니다."
          else
            echo "::warning::이 서명 지문($sha1)이 google-services.json 에 없습니다. DEBUG_KEYSTORE_BASE64 가 내 PC 의 ~/.android/debug.keystore 인지 확인하세요."
          fi
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # Gradle 이 다른 위치에 새 디버그 키를 만들지 않고 위에서 넣은 키를 쓰도록 위치를 못박습니다.
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-} ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-}"
          ./gradlew --no-daemon assembleDebug
      - name: Check the APK is signed with the registered key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk_sha1=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | awk -F': ' '/certificate SHA-1 digest/ {print $NF; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK 서명 SHA-1: $apk_sha1"
          if jq -e --arg h "$apk_sha1" '[.. | .certificate_hash? // empty] | index($h)' app/google-services.json > /dev/null; then
            echo "Firebase 에 등록된 지문과 같습니다."
          else
            echo "::error::APK 서명($apk_sha1)이 Firebase/Google 콘솔에 등록된 지문과 달라 Google 로그인이 되지 않습니다."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send to phones (Firebase App Distribution)
        env:
          TESTERS: ${{ vars.TESTER_EMAILS }}
          NOTES: ${{ github.event.head_commit.message || format('수동 실행 ({0})', github.sha) }}
        run: |
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name=="com.plantdex.app") | .client_info.mobilesdk_app_id' app/google-services.json)
          printf '%s\n' "$NOTES" | head -c 15000 > release-notes.txt
          args=(app/build/outputs/apk/debug/app-debug.apk --app "$APP_ID" --project "$FIREBASE_PROJECT" --release-notes-file release-notes.txt)
          if [ -n "$TESTERS" ]; then args+=(--testers "$TESTERS"); fi
          npx --yes firebase-tools@latest appdistribution:distribute "${args[@]}"

  logs:
    needs: plan
    if: needs.plan.outputs.logs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Server logs (last 24h)
        env:
          EXTRA: ${{ inputs.log_filter }}
        run: |
          filter='resource.type="cloud_run_revision"'
          if [ -n "$EXTRA" ]; then filter="$filter AND ($EXTRA)"; fi
          gcloud logging read "$filter" --project "$FIREBASE_PROJECT" --freshness=1d --limit=150 --format=json \
            | jq -r 'reverse | .[] | [.timestamp, .resource.labels.service_name, .severity,
                ((.jsonPayload // .textPayload // .httpRequest // {}) | tostring | .[0:600])] | @tsv'
